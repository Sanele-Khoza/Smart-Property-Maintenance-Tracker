<svg
  xmlns="http://www.w3.org/2000/svg"
  viewBox="0 0 200 200"
  width="200"
  height="200"
>
  <!-- Outer circle glow effect -->
  <filter id="glow">
    <feGaussianBlur stdDeviation="3" result="coloredBlur" />
    <feMerge>
      <feMergeNode in="coloredBlur" />
      <feMergeNode in="SourceGraphic" />
    </feMerge>
  </filter>

  <!-- Radar sweep effect -->
  <circle
    cx="100"
    cy="100"
    r="92"
    fill="#001a00"
    stroke="#00ff41"
    stroke-width="3"
    filter="url(#glow)"
  />

  <!-- Radar grid circles -->
  <circle
    cx="100"
    cy="100"
    r="30"
    fill="none"
    stroke="#00ff41"
    stroke-width="1"
    opacity="0.4"
  />
  <circle
    cx="100"
    cy="100"
    r="55"
    fill="none"
    stroke="#00ff41"
    stroke-width="1"
    opacity="0.3"
  />
  <circle
    cx="100"
    cy="100"
    r="75"
    fill="none"
    stroke="#00ff41"
    stroke-width="1"
    opacity="0.2"
  />

  <!-- Radar crosshairs -->
  <line
    x1="8"
    y1="100"
    x2="192"
    y2="100"
    stroke="#00ff41"
    stroke-width="1"
    opacity="0.3"
  />
  <line
    x1="100"
    y1="8"
    x2="100"
    y2="192"
    stroke="#00ff41"
    stroke-width="1"
    opacity="0.3"
  />

  <!-- Radar sweep arc -->
  <path
    d="M 100 100 L 180 50 A 92 92 0 0 1 180 150 Z"
    fill="#00ff41"
    opacity="0.15"
  />

  <!-- Building/House shape - green -->
  <polygon
    points="100,25 55,60 55,115 72,115 72,85 128,85 128,115 145,115 145,60"
    fill="none"
    stroke="#00ff41"
    stroke-width="4"
    stroke-linejoin="round"
    filter="url(#glow)"
  />

  <!-- Roof lines -->
  <line
    x1="55"
    y1="60"
    x2="100"
    y2="25"
    stroke="#00ff41"
    stroke-width="4"
    filter="url(#glow)"
  />
  <line
    x1="100"
    y1="25"
    x2="145"
    y2="60"
    stroke="#00ff41"
    stroke-width="4"
    filter="url(#glow)"
  />

  <!-- Door -->
  <rect
    x="87"
    y="88"
    width="26"
    height="27"
    rx="2"
    fill="none"
    stroke="#00ff41"
    stroke-width="3"
    filter="url(#glow)"
  />

  <!-- Door knob -->
  <circle cx="107" cy="102" r="2.5" fill="#00ff41" filter="url(#glow)" />

  <!-- Left window -->
  <rect
    x="61"
    y="67"
    width="11"
    height="11"
    rx="1"
    fill="none"
    stroke="#00ff41"
    stroke-width="2.5"
    filter="url(#glow)"
  />
  <line
    x1="66.5"
    y1="67"
    x2="66.5"
    y2="78"
    stroke="#00ff41"
    stroke-width="1.5"
  />
  <line
    x1="61"
    y1="72.5"
    x2="72"
    y2="72.5"
    stroke="#00ff41"
    stroke-width="1.5"
  />

  <!-- Right window -->
  <rect
    x="128"
    y="67"
    width="11"
    height="11"
    rx="1"
    fill="none"
    stroke="#00ff41"
    stroke-width="2.5"
    filter="url(#glow)"
  />
  <line
    x1="133.5"
    y1="67"
    x2="133.5"
    y2="78"
    stroke="#00ff41"
    stroke-width="1.5"
  />
  <line
    x1="128"
    y1="72.5"
    x2="139"
    y2="72.5"
    stroke="#00ff41"
    stroke-width="1.5"
  />

  <!-- Small top left window -->
  <rect
    x="72"
    y="58"
    width="7"
    height="7"
    rx="1"
    fill="none"
    stroke="#00ff41"
    stroke-width="2"
    filter="url(#glow)"
  />

  <!-- Small top right window -->
  <rect
    x="121"
    y="58"
    width="7"
    height="7"
    rx="1"
    fill="none"
    stroke="#00ff41"
    stroke-width="2"
    filter="url(#glow)"
  />

  <!-- SPMT text - green -->
  <text
    x="100"
    y="153"
    font-family="Arial, Helvetica, sans-serif"
    font-size="26"
    font-weight="bold"
    fill="#00ff41"
    text-anchor="middle"
    letter-spacing="4"
    filter="url(#glow)"
  >
    SPMT
  </text>

  <!-- Blinking dot effect -->
  <circle
    cx="100"
    cy="100"
    r="4"
    fill="#00ff41"
    opacity="0.8"
    filter="url(#glow)"
  />
</svg>
